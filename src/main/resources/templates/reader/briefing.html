<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="'每日简报 · ' + ${date}">每日简报</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/admin.css">
  <link rel="stylesheet" href="/admin-controls.css">
  <link rel="stylesheet" href="/admin-views.css">
  <link rel="stylesheet" href="/reader.css">
  <link rel="stylesheet" href="/briefing.css">
  <link rel="stylesheet" href="/article.css">
  <script defer src="/ui.js"></script>
  <script defer src="/article.js"></script>
  <script defer src="/compact-summary.js"></script>
  <link rel="stylesheet" href="/ui-controls.css">
</head>
<body class="reader-page">
<a class="skip-link" href="#briefing-content">跳到每日简报</a>

<div class="rd-progress-bar" id="rd-progress-bar" aria-hidden="true"></div>

<main class="bf-wrap">
  <nav class="reader-nav" aria-label="阅读导航">
    <a href="/reader"><svg th:replace="~{shared/icons :: icon('book')}"></svg><span>速览</span></a>
    <a href="/reader/briefing" aria-current="page"><svg th:replace="~{shared/icons :: icon('news')}"></svg><span>每日简报</span></a>
    <a href="/reader/radar"><svg th:replace="~{shared/icons :: icon('radar')}"></svg><span>精选日报</span></a>
    <a href="/reader/bookmarks"><svg th:replace="~{shared/icons :: icon('bookmark')}"></svg><span>收藏</span></a>
    <a href="/reader/search"><svg th:replace="~{shared/icons :: icon('search')}"></svg><span>搜索</span></a>
    <a th:if="${viewer == null or viewer.admin()}" href="/index#subscriptions"><svg th:replace="~{shared/icons :: icon('rss')}"></svg><span>订阅来源</span></a>
    <a th:if="${viewer == null or viewer.admin()}" href="/index" class="reader-nav-admin"><svg th:replace="~{shared/icons :: icon('settings')}"></svg><span>管理</span></a>
    <a href="/account" class="reader-nav-account" th:if="${viewer != null}" th:classappend="${!viewer.admin()} ? ' reader-nav-admin'"><svg th:replace="~{shared/icons :: icon('user')}"></svg><span th:text="${viewer.name()}">账户</span></a>
  </nav>


  <!-- ── Header ──────────────────────────────────────────────── -->
  <header class="bf-header">
    <div>
      <div class="page-eyebrow">一天的信息切片</div>
      <h1 class="bf-title">每日简报</h1>
      <div class="bf-date" th:text="${date}">2026-06-26</div>
    </div>

    <!-- Date navigation -->
    <div class="bf-date-nav" aria-label="简报日期">
      <a th:href="'/reader/briefing?date=' + ${prevDate}" class="bf-nav-btn" aria-label="前一天" title="前一天"><svg th:replace="~{shared/icons :: icon('left')}"></svg></a>
      <label class="bf-date-label">
        <input type="date" class="bf-date-picker"
               th:value="${dateIso}" th:max="${todayIso}" aria-label="选择简报日期"
               onchange="if (this.value &amp;&amp; this.validity.valid) location.href='/reader/briefing?date='+encodeURIComponent(this.value)">
        <span class="bf-date-display" th:text="${dateIso}">2026-06-26</span>
      </label>
      <a th:href="${dateIso &lt; todayIso} ? '/reader/briefing?date=' + ${nextDate} : null"
         class="bf-nav-btn"
         th:classappend="${dateIso >= todayIso} ? ' bf-nav-btn--disabled'"
         th:attr="aria-disabled=${dateIso >= todayIso},tabindex=${dateIso >= todayIso ? '-1' : null}"
         aria-label="后一天" title="后一天"><svg th:replace="~{shared/icons :: icon('right')}"></svg></a>
      <a th:if="${!isToday}" href="/reader/briefing" class="bf-nav-today">今天</a>
    </div>

    <div class="bf-header-right">
      <div class="bf-total-block">
        <span class="bf-total" th:text="${totalCount}">0</span>
        <span class="bf-total-label">篇文章</span>
      </div>
    </div>
  </header>
  <section id="briefing-content" tabindex="-1" aria-label="当日内容">

  <p th:if="${totalCount > totalStoryCount}" class="bf-folding-note"
     th:text="${totalCount} + ' 篇文章折叠为 ' + ${totalStoryCount} + ' 组报道。同标题报道可展开查看全部原文。'"></p>

  <!-- ── Empty state ─────────────────────────────────────────── -->
  <div th:if="${sections.isEmpty()}" class="bf-empty">
    <strong>这一天还没有内容</strong>
    <p>切换日期回看历史简报，或到速览查看最近的更新。</p>
    <div class="reader-source-empty-actions">
      <a href="/reader" class="reader-empty-action">查看最近内容 →</a>
      <a th:if="${viewer == null or viewer.admin()}" href="/index#subscriptions" class="reader-empty-action">选择订阅来源</a>
    </div>
  </div>

  <!-- ── Sections grid ───────────────────────────────────────── -->
  <div th:if="${!sections.isEmpty()}" class="bf-grid">
    <div th:each="sec, si : ${sections}" class="bf-section reveal">

      <div class="bf-section-head">
        <h2 class="bf-cat-name" th:text="${sec.category()}">分类</h2>
        <span class="bf-cat-count"
              th:text="${sec.totalStoryCount()} + ' 组 · ' + ${sec.totalCount()} + ' 篇'">0 组 · 0 篇</span>
      </div>

      <div class="bf-items">
        <div th:each="story, ii : ${sec.stories()}" class="bf-item" th:with="item=${story.primary()}">
          <span class="bf-item-num" th:text="${ii.index + 1}">1</span>
          <div class="bf-item-body">
            <a class="bf-item-title"
               th:href="${item.link()}"
               th:text="${item.title()}"
               target="_blank" rel="noopener noreferrer">标题</a>
            <div class="bf-item-meta">
              <a class="reader-article-link" th:href="${'/reader/article?link=' + #uris.escapeQueryParam(item.link())}" data-article-link>站内阅读</a>
              <span class="bf-item-src" th:text="${sourceLabels != null and sourceLabels.get(item.routePath()) != null ? sourceLabels.get(item.routePath()) : item.sourceLabel()}">来源</span>
              <span class="bf-item-age" th:text="'获取 ' + ${item.formattedFetchedAt()}">获取 —</span>
              <span class="bf-item-age" th:text="'发布 ' + ${item.formattedPublishedAt()}">发布 —</span>
            </div>
            <div th:replace="~{reader/fragments :: compactSummary(${item})}"></div>
            <details th:if="${!story.related().isEmpty()}" class="bf-related">
              <summary th:text="'另有 ' + ${#lists.size(story.related())} + ' 篇同标题报道'">同标题报道</summary>
              <div th:each="related : ${story.related()}" class="bf-related-item">
                <a class="bf-item-title" th:href="${related.link()}" th:text="${related.title()}"
                   target="_blank" rel="noopener noreferrer">标题</a>
                <div class="bf-item-meta">
                  <a class="reader-article-link" th:href="${'/reader/article?link=' + #uris.escapeQueryParam(related.link())}" data-article-link>站内阅读</a>
                  <span class="bf-item-src" th:text="${sourceLabels != null and sourceLabels.get(related.routePath()) != null ? sourceLabels.get(related.routePath()) : related.sourceLabel()}">来源</span>
                  <span class="bf-item-age" th:text="'获取 ' + ${related.formattedFetchedAt()}">获取 —</span>
                  <span class="bf-item-age" th:text="'发布 ' + ${related.formattedPublishedAt()}">发布 —</span>
                </div>
                <div th:replace="~{reader/fragments :: compactSummary(${related})}"></div>
              </div>
            </details>
          </div>
        </div>
      </div>

      <div th:if="${sec.totalStoryCount() > #lists.size(sec.stories())}"
           class="bf-more"
           th:text="'还有 ' + (${sec.totalStoryCount()} - ${#lists.size(sec.stories())}) + ' 组未展示'">
      </div>
    </div>
  </div>

  </section>
</main>
</body>
</html>
