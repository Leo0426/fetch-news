<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>收藏夹</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/admin.css">
  <link rel="stylesheet" href="/admin-controls.css">
  <link rel="stylesheet" href="/admin-views.css">
  <link rel="stylesheet" href="/reader.css">
  <link rel="stylesheet" href="/briefing.css">
  <link rel="stylesheet" href="/article.css">
  <script src="/htmx.min.js"></script>
  <script defer src="/ui.js"></script>
  <script defer src="/article.js"></script>
  <script defer src="/reader.js"></script>
  <script defer src="/reader-page.js"></script>
  <link rel="stylesheet" href="/ui-controls.css">
</head>
<body class="reader-page">
<a class="skip-link" href="#bookmark-content">跳到收藏文章</a>

<div class="rd-progress-bar" id="rd-progress-bar" aria-hidden="true"></div>

<main class="bm-wrap">
  <nav class="reader-nav" aria-label="阅读导航">
    <a href="/reader"><svg th:replace="~{shared/icons :: icon('book')}"></svg><span>速览</span></a>
    <a href="/reader/unread"><svg th:replace="~{shared/icons :: icon('inbox')}"></svg><span>待读</span></a>
    <a href="/reader/briefing"><svg th:replace="~{shared/icons :: icon('news')}"></svg><span>每日简报</span></a>
    <a href="/reader/radar"><svg th:replace="~{shared/icons :: icon('radar')}"></svg><span>精选日报</span></a>
    <a href="/reader/bookmarks" aria-current="page"><svg th:replace="~{shared/icons :: icon('bookmark')}"></svg><span>收藏</span></a>
    <a href="/reader/search"><svg th:replace="~{shared/icons :: icon('search')}"></svg><span>搜索</span></a>
    <a th:if="${viewer == null or viewer.admin()}" href="/index#subscriptions"><svg th:replace="~{shared/icons :: icon('rss')}"></svg><span>订阅来源</span></a>
    <a th:if="${viewer == null or viewer.admin()}" href="/index" class="reader-nav-admin"><svg th:replace="~{shared/icons :: icon('settings')}"></svg><span>管理</span></a>
    <a href="/account" class="reader-nav-account" th:if="${viewer != null}" th:classappend="${!viewer.admin()} ? ' reader-nav-admin'"><svg th:replace="~{shared/icons :: icon('user')}"></svg><span th:text="${viewer.name()}">账户</span></a>
  </nav>


  <header class="bm-head">
    <div>
      <div class="page-eyebrow">留给下一次阅读</div>
      <h1 class="bm-title">收藏夹</h1>
      <div id="bookmark-count" class="bm-count" role="status" aria-live="polite" th:text="${#lists.size(items)} + ' 条收藏'">0 条收藏</div>
    </div>
    <p class="reader-header-note">保存值得回看的内容。</p>
  </header>

  <section id="bookmark-content" tabindex="-1" aria-label="已收藏文章">
  <div id="bookmark-empty" th:hidden="${not #lists.isEmpty(items)}" class="bm-empty">
    <strong>值得留下的文章，会在这里等你</strong>
    <p>在速览中点击书签图标，即可随时回来继续阅读。</p>
    <div class="reader-source-empty-actions">
      <a href="/reader" class="reader-empty-action">去速览发现内容 →</a>
      <a th:if="${viewer == null or viewer.admin()}" href="/index#subscriptions" class="reader-empty-action">选择订阅来源</a>
    </div>
  </div>

  <div class="bm-grid" data-bookmark-grid th:hidden="${#lists.isEmpty(items)}">
    <div th:each="item, is : ${items}" class="bm-card reveal"
         th:attr="data-link=${item.link()},data-read=${readStateAvailable ? (#lists.contains(readLinks, item.link()) ? 'true' : 'false') : 'unknown'}">

      <a class="bm-card-title"
         th:href="${item.link()}"
         th:text="${not #strings.isEmpty(item.title())} ? ${item.title()} : ${item.link()}"
         target="_blank" rel="noopener noreferrer">标题</a>

      <div class="bm-card-meta">
        <span class="bm-src" th:text="${sourceLabels != null and sourceLabels[item.routePath()] != null ? sourceLabels[item.routePath()] : item.sourceLabel()}">来源</span>
        <span class="bm-date" th:text="${item.formattedAge()}">收藏时间</span>
        <span class="bm-date" data-bookmark-read-state role="status" aria-live="polite"
              th:text="${readStateAvailable ? (#lists.contains(readLinks, item.link()) ? '已读' : '未读') : '状态待确认'}">未读</span>
        <a class="reader-article-link" th:href="${'/reader/article?link=' + #uris.escapeQueryParam(item.link())}" data-article-link>站内阅读</a>
        <form style="display:contents">
          <input type="hidden" name="link" th:value="${item.link()}">
          <button type="button" class="bm-remove"
                  hx-delete="/reader/bookmark"
                  hx-target="closest .bm-card"
                  hx-swap="outerHTML"
                  hx-disabled-elt="this"
                  hx-include="closest form"
                  hx-confirm="取消收藏这篇文章？"
                  th:attr="aria-label='取消收藏：' + ${item.title()}">
            取消收藏
          </button>
        </form>
      </div>
      <div class="form-msg err" data-bookmark-read-error role="alert" hidden>
        <span>暂时无法确认已读状态。请重试，或进入站内阅读后标记。</span>
        <button class="btn" type="button" data-bookmark-read-retry>重试标记已读</button>
      </div>

    </div>
  </div>

  </section>
</main>
</body>
</html>
