<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>收藏夹</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/admin.css">
  <script src="/htmx.min.js"></script>
</head>
<body>

<div class="rd-progress-bar" id="rd-progress-bar"></div>

<div class="bm-wrap">

  <div class="bm-head">
    <div>
      <div class="bm-title">★ 收藏夹</div>
      <div class="bm-count" th:text="${#lists.size(items)} + ' 条收藏'">0 条收藏</div>
    </div>
    <div class="bm-nav">
      <a href="/reader" class="bm-link">← 返回速览</a>
      <a href="/index" class="bm-link">路由配置 →</a>
    </div>
  </div>

  <div th:if="${#lists.isEmpty(items)}" class="bm-empty">
    还没有收藏任何文章<br>
    <span style="font-size:12px;">在速览页点击文章卡片右下角的书签图标即可收藏</span>
  </div>

  <div th:if="${not #lists.isEmpty(items)}" class="bm-grid">
    <div th:each="item, is : ${items}" class="bm-card reveal">

      <a class="bm-card-title"
         th:href="${item.link()}"
         th:text="${not #strings.isEmpty(item.title())} ? ${item.title()} : ${item.link()}"
         target="_blank" rel="noopener noreferrer">标题</a>

      <div class="bm-card-meta">
        <span class="bm-src" th:text="${item.sourceLabel()}">来源</span>
        <span class="bm-date" th:text="${item.formattedAge()}">收藏时间</span>
        <form style="display:contents">
          <input type="hidden" name="link" th:value="${item.link()}">
          <button type="button" class="bm-remove"
                  hx-delete="/reader/bookmark"
                  hx-target="closest .bm-card"
                  hx-swap="outerHTML swap:0.3s"
                  hx-include="closest form"
                  hx-confirm="确认取消收藏？">
            取消收藏
          </button>
        </form>
      </div>

    </div>
  </div>

</div>

<script>
  /* Progress bar */
  (function () {
    var bar = document.getElementById('rd-progress-bar');
    if (!bar) return;
    function tick() {
      var total = document.documentElement.scrollHeight - window.innerHeight;
      var pct   = total > 0 ? (window.scrollY / total) * 100 : 0;
      bar.style.width = pct.toFixed(2) + '%';
      if (pct >= 99.5) bar.classList.add('done');
      else             bar.classList.remove('done');
    }
    window.addEventListener('scroll', tick, { passive: true });
    tick();
  })();

  /* Scroll reveal with stagger */
  (function () {
    document.querySelectorAll('.bm-grid .reveal').forEach(function (card, i) {
      card.style.transitionDelay = Math.min(i, 8) * 50 + 'ms';
    });
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (entry.isIntersecting) {
          entry.target.classList.add('in');
          io.unobserve(entry.target);
        }
      });
    }, { threshold: 0.06, rootMargin: '0px 0px -24px 0px' });
    document.querySelectorAll('.reveal').forEach(function (el) { io.observe(el); });
  })();
</script>

</body>
</html>
