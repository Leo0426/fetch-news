<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${page.query.isEmpty()} ? '搜索' : '搜索：' + ${page.query}">搜索</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/admin.css">
  <link rel="stylesheet" href="/admin-controls.css">
  <link rel="stylesheet" href="/admin-views.css">
  <link rel="stylesheet" href="/reader.css">
  <link rel="stylesheet" href="/briefing.css">
  <link rel="stylesheet" href="/article.css">
  <link rel="stylesheet" href="/search.css">
  <script defer src="/ui.js"></script>
  <script defer src="/article.js"></script>
  <link rel="stylesheet" href="/ui-controls.css">
</head>
<body class="reader-page search-page">
<a class="skip-link" href="#search-content">跳到搜索结果</a>
<main class="rd-wrap">
  <nav th:replace="~{reader/navigation :: bar('search')}"></nav>

  <header class="rd-head search-head">
    <div>
      <h1 class="rd-title">搜索历史</h1>
      <p class="rd-date">搜索所有时间范围内已保存的标题、正文描述与 AI 摘要。</p>
    </div>
  </header>

  <section class="reader-toolbar search-toolbar" aria-label="搜索历史内容">
    <form action="/reader/search" method="get" class="rd-search-form" role="search">
      <label class="sr-only" for="history-query">搜索标题、正文描述与 AI 摘要</label>
      <input id="history-query" class="ui-control rd-search-input" type="search" name="q"
             th:value="${page.query}"
             placeholder="搜索已保存的文章…" pattern=".{2,200}" title="请输入 2–200 个字符" required
             aria-describedby="history-search-hint" autocomplete="off" th:autofocus="${page.query.isEmpty()}">
      <button type="submit" class="rd-search-submit"><svg th:replace="~{shared/icons :: icon('search')}"></svg>搜索</button>
    </form>
    <p id="history-search-hint" class="reader-toolbar-hint">输入 2–200 个字符。用空格分隔多个关键词，可缩小搜索范围。</p>
  </section>

  <section id="search-content" tabindex="-1" aria-label="搜索结果">
    <div th:if="${page.error != null}" class="rd-empty search-error" role="alert">
      <strong>暂时无法完成搜索</strong>
      <p th:text="${page.error}">请稍后重试。</p>
      <a href="#history-query" class="reader-empty-action">返回搜索框</a>
    </div>

    <th:block th:if="${page.error == null}">
      <p th:if="${page.query.isEmpty()}" class="search-welcome">
        例如，搜索「电池 回收」会找到同时提到这两个词的文章。
      </p>

      <th:block th:if="${!page.query.isEmpty()}">
        <div class="rd-result-meta search-result-meta" role="status">
          <span class="search-query">“<strong th:text="${page.query}">关键词</strong>”</span>
          <span th:if="${page.items.isEmpty()}">暂无匹配内容</span>
          <span th:if="${!page.items.isEmpty() and !page.hasMore}">找到 <strong th:text="${page.items.size()}">0</strong> 条结果</span>
          <span th:if="${page.hasMore}">展示前 <strong th:text="${page.items.size()}">100</strong> 条结果</span>
        </div>

        <div th:if="${page.items.isEmpty()}" class="rd-empty">
          <strong>还没有找到这条线索</strong>
          <p>试试更短的词，或减少关键词；多个关键词需要同时出现在一篇文章中。</p>
          <a href="#history-query" class="reader-empty-action">换个关键词</a>
        </div>

        <div th:if="${!page.items.isEmpty()}" class="search-results">
          <article th:each="item : ${page.items}" class="rd-card search-result">
            <h2 class="search-result-heading">
              <a class="rd-card-title" th:href="${item.article.link()}" target="_blank" rel="noopener noreferrer"><th:block th:each="part : ${item.titleParts}"><mark th:if="${part.matched}" th:text="${part.text}"></mark><th:block th:unless="${part.matched}" th:text="${part.text}"></th:block></th:block></a>
            </h2>
            <div th:if="${!item.excerptParts.isEmpty()}" class="search-excerpt">
              <span class="search-excerpt-label" th:text="${item.excerptLabel}">正文摘录</span>
              <p class="search-excerpt-text"><th:block th:each="part : ${item.excerptParts}"><mark th:if="${part.matched}" th:text="${part.text}"></mark><th:block th:unless="${part.matched}" th:text="${part.text}"></th:block></th:block></p>
            </div>
            <div class="rd-card-meta">
              <span class="rd-src" th:text="${sourceLabels != null and sourceLabels.get(item.article.routePath()) != null ? sourceLabels.get(item.article.routePath()) : item.article.sourceLabel()}">来源</span>
              <span class="rd-age" th:text="'获取 ' + ${item.article.formattedFetchedAt()}">获取 —</span>
              <span class="rd-age" th:text="'发布 ' + ${item.article.formattedPublishedAt()}">发布 —</span>
              <a class="reader-article-link" th:href="${'/reader/article?link=' + #uris.escapeQueryParam(item.article.link())}" data-article-link>站内阅读</a>
              <a class="reader-article-link" th:href="${item.article.link()}" target="_blank"
                 rel="noopener noreferrer">打开原文 <span aria-hidden="true">↗</span></a>
            </div>
          </article>
        </div>

        <p th:if="${page.hasMore}" class="search-limit-note">还有更多匹配内容。增加关键词，可以进一步缩小范围。</p>
      </th:block>
    </th:block>
  </section>
</main>
</body>
</html>
