<div th:fragment="summaryStatus(item)"
     th:if="${item.hasSummary() or item.hasSummaryStatus()}"
     th:with="status=${item.summaryStatus()}"
     class="reader-summary-status"
     role="status" aria-live="polite" aria-atomic="true" tabindex="-1"
     th:classappend="${!item.hasSummary() and status != null and (status.queued() or status.running())} ? ' running' : (${!item.hasSummary() and status != null and status.error()} ? ' err' : '')">
  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor"
       stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="m12 3 2.7 6.3L21 12l-6.3 2.7L12 21l-2.7-6.3L3 12l6.3-2.7Z"/>
  </svg>
  <span th:text="${item.hasSummary()} ? 'AI 摘要' : (${status != null and status.queued()} ? '排队中' : (${status != null and status.running()} ? '正在生成摘要' : (${status != null and status.error()} ? '摘要生成失败' : 'AI 摘要')))">AI 摘要</span>
</div>

<div th:fragment="compactSummary(item)"
     th:if="${item.hasSummary() or item.hasSummaryStatus()}"
     th:with="status=${item.summaryStatus()}"
     data-compact-summary
     th:attr="data-link=${item.link()},data-summary-state=${item.hasSummary() ? 'success' : status.status()}">
  <div th:replace="~{reader/fragments :: summaryStatus(${item})}"></div>
  <div class="bf-item-summary" data-compact-summary-text
       th:hidden="${!item.hasSummary()}" th:text="${item.summary()}"></div>
  <p class="rd-summarize-err" data-compact-summary-error
     th:hidden="${item.hasSummary() or status == null or !status.error()}"
     th:text="${!item.hasSummary() and status != null and status.error()} ? ${status.errorMessage()} : ''"></p>
  <button type="button" class="rd-summarize-retry" data-compact-summary-check hidden>重新查看状态</button>
  <a class="reader-article-link" data-compact-summary-recovery data-article-link
     th:hidden="${item.hasSummary() or status == null or !status.error()}"
     th:href="${'/reader/article?link=' + #uris.escapeQueryParam(item.link())}">查看文章与摘要 →</a>
  <noscript th:if="${!item.hasSummary() and status != null and (status.queued() or status.running())}">
    <p class="rd-summarize-loading">刷新页面或进入站内阅读可查看最新摘要。</p>
  </noscript>
</div>

<div th:fragment="articleCard(item, aiEnabled)"
     class="rd-card reveal"
     th:with="status=${item.summaryStatus()}"
     th:attr="data-link=${item.link()},data-title=${item.title()},data-route-path=${item.routePath()},data-summary-state=${item.hasSummary() ? 'success' : (status != null ? status.status() : 'none')},data-summary-error=${status != null and status.error() ? status.errorMessage() : ''},data-ai-enabled=${aiEnabled}"
     :class="{'rd-card--read': isRead($el.dataset.link), 'rd-card--bookmarked': isBookmarked($el.dataset.link)}"
     x-show="itemVisible($el)">

  <a class="rd-card-title"
     th:href="${item.link()}"
     th:text="${item.title()}"
     @click="markRead($el.closest('[data-link]').dataset.link)"
     target="_blank" rel="noopener noreferrer">标题</a>

  <th:block th:if="${item.hasSummary()}">
    <th:block th:replace="~{reader/fragments :: summaryStatus(${item})}"></th:block>
  </th:block>
  <p th:if="${item.hasSummary()}"
     class="rd-summary"
     th:text="${item.summary()}"></p>

  <div th:if="${!item.hasSummary()}" class="rd-summarize-wrap"
       x-show="aiEnabled[$el.closest('[data-link]').dataset.link] || summaryState($el.closest('[data-link]').dataset.link) !== 'none' || aiUncertain[$el.closest('[data-link]').dataset.link]">
    <div class="reader-summary-status" role="status" aria-live="polite" aria-atomic="true"
         x-show="summaryLabel($el.closest('[data-link]').dataset.link)"
         :class="{'running': isSummarizing($el.closest('[data-link]').dataset.link) && !aiUncertain[$el.closest('[data-link]').dataset.link], 'err': summaryState($el.closest('[data-link]').dataset.link) === 'error' || aiUncertain[$el.closest('[data-link]').dataset.link]}"
         th:style="${status == null} ? 'display:none' : null">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="m12 3 2.7 6.3L21 12l-6.3 2.7L12 21l-2.7-6.3L3 12l6.3-2.7Z"/>
      </svg>
      <span x-text="summaryLabel($el.closest('[data-link]').dataset.link)"
            th:text="${status != null and status.queued()} ? '已加入队列 · 排队中' : (${status != null and status.running()} ? '正在生成摘要' : (${status != null and status.error()} ? '摘要生成失败' : ''))"></span>
    </div>
    <p x-show="summary($el.closest('[data-link]').dataset.link)"
       x-text="summary($el.closest('[data-link]').dataset.link) || ''"
       class="rd-summary" style="display:none"></p>
    <p x-show="['queued', 'running'].includes(summaryState($el.closest('[data-link]').dataset.link)) && !aiUncertain[$el.closest('[data-link]').dataset.link]"
       x-text="!aiEnabled[$el.closest('[data-link]').dataset.link] && summaryState($el.closest('[data-link]').dataset.link) === 'queued' ? 'AI 已关闭，任务保留在队列中。' : '可以继续阅读，完成后自动显示。'"
       class="rd-summarize-loading" style="display:none"></p>
    <div x-show="aiUncertain[$el.closest('[data-link]').dataset.link]"
         class="rd-summarize-err" role="alert" style="display:none">
      <span>暂时无法连接，可重新查看任务状态。</span>
      <button type="button" @click.stop="checkSummary($el.closest('[data-link]').dataset.link)"
              :disabled="!!summarizing[$el.closest('[data-link]').dataset.link]"
              class="rd-summarize-retry"
              x-text="summarizing[$el.closest('[data-link]').dataset.link] ? '查询中…' : '重新查看状态'">重新查看状态</button>
    </div>
    <div x-show="summaryError($el.closest('[data-link]').dataset.link) && !aiUncertain[$el.closest('[data-link]').dataset.link]"
         class="rd-summarize-err" role="alert" style="display:none">
      <span x-text="summaryError($el.closest('[data-link]').dataset.link) || ''"></span>
      <button th:if="${aiEnabled}" type="button"
              @click.stop="summarize($el.closest('[data-link]').dataset.link,
                                     $el.closest('[data-link]').dataset.title)"
              :disabled="isSummarizing($el.closest('[data-link]').dataset.link)"
              class="rd-summarize-retry">重试生成</button>
    </div>
    <button th:if="${aiEnabled}" type="button"
            x-show="summaryState($el.closest('[data-link]').dataset.link) === 'none'
                 && !isSummarizing($el.closest('[data-link]').dataset.link)
                 && !aiUncertain[$el.closest('[data-link]').dataset.link]"
            @click.stop="summarize($el.closest('[data-link]').dataset.link,
                                   $el.closest('[data-link]').dataset.title)"
            :disabled="isSummarizing($el.closest('[data-link]').dataset.link)"
            class="rd-summarize-btn">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" aria-hidden="true"
           stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
        <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>
      </svg>
      AI 摘要
    </button>
  </div>

  <div class="rd-card-meta">
    <div class="reader-article-info">
      <span class="rd-src" th:text="${sourceLabels != null and sourceLabels[item.routePath()] != null ? sourceLabels[item.routePath()] : item.sourceLabel()}">来源</span>
      <span class="rd-age" th:text="'获取 ' + ${item.formattedFetchedAt()}">获取 —</span>
      <span class="rd-age" th:text="'发布 ' + ${item.formattedPublishedAt()}">发布 —</span>
    </div>
    <div class="reader-card-actions">
    <a class="reader-article-link" th:href="${'/reader/article?link=' + #uris.escapeQueryParam(item.link())}" data-article-link>站内阅读</a>
    <button type="button" class="rd-bookmark-btn"
            :disabled="!!bookmarkPending[$el.closest('[data-link]').dataset.link]"
            :aria-busy="!!bookmarkPending[$el.closest('[data-link]').dataset.link]"
            :aria-pressed="isBookmarked($el.closest('[data-link]').dataset.link)"
            :aria-label="isBookmarked($el.closest('[data-link]').dataset.link) ? '取消收藏' : '收藏文章'"
            :class="isBookmarked($el.closest('[data-link]').dataset.link) && 'bookmarked'"
            :title="isBookmarked($el.closest('[data-link]').dataset.link) ? '取消收藏' : '收藏'"
            @click.stop="toggleBookmark(
              $el.closest('[data-link]').dataset.link,
              $el.closest('[data-link]').dataset.title,
              $el.closest('[data-link]').dataset.routePath)">
      <svg width="12" height="12" viewBox="0 0 24 24"
           stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
           :fill="isBookmarked($el.closest('[data-link]').dataset.link) ? 'currentColor' : 'none'">
        <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>
      </svg>
    </button>
    <button type="button" class="rd-read-dot"
            :disabled="readBusy($el.closest('[data-link]').dataset.link)"
            :aria-busy="readBusy($el.closest('[data-link]').dataset.link)"
            :aria-pressed="isRead($el.closest('[data-link]').dataset.link)"
            :aria-label="isRead($el.closest('[data-link]').dataset.link) ? '标为未读' : '标为已读'"
            @click.stop="toggleRead($el.closest('[data-link]').dataset.link)"
            :title="isRead($el.closest('[data-link]').dataset.link) ? '标为未读' : '标为已读'">
      <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true">
        <circle class="reader-unread-mark" cx="12" cy="12" r="4" fill="currentColor"/>
        <path class="reader-read-mark" d="m5 12 4 4L19 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span x-text="readBusy($el.closest('[data-link]').dataset.link) ? '保存中' : (isRead($el.closest('[data-link]').dataset.link) ? '已读' : '未读')">未读</span>
    </button>
    </div>
  </div>
</div>
