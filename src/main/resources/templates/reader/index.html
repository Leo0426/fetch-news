<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${hours <= 24 ? '今日速览' : hours <= 48 ? '近 48 小时' : hours <= 72 ? '近 3 天' : '近 7 天'}">今日速览</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/admin.css">
  <link rel="stylesheet" href="/admin-controls.css">
  <link rel="stylesheet" href="/admin-views.css">
  <link rel="stylesheet" href="/reader.css">
  <link rel="stylesheet" href="/briefing.css">
  <link rel="stylesheet" href="/article.css">
  <script th:inline="javascript">
    const _fnBookmarks = /*[[${bookmarkedLinks}]]*/ [];
    const _fnReads = /*[[${readLinks}]]*/ [];
  </script>
  <script defer src="/ui.js"></script>
  <script defer src="/article.js"></script>
  <script defer src="/reader.js"></script>
  <script defer src="/reader-page.js"></script>
  <script defer src="/alpine.min.js"></script>
  <link rel="stylesheet" href="/ui-controls.css">
</head>
<body class="reader-page" x-data="readerState()" data-reader>
<a class="skip-link" href="#rd-main">跳到文章</a>
<div class="rd-progress-bar" id="rd-progress-bar" aria-hidden="true"></div>
<main class="rd-wrap">
  <nav class="reader-nav" aria-label="阅读导航">
    <a href="/reader" aria-current="page"><svg th:replace="~{shared/icons :: icon('book')}"></svg><span>速览</span></a>
    <a href="/reader/unread"><svg th:replace="~{shared/icons :: icon('inbox')}"></svg><span>待读</span></a>
    <a href="/reader/briefing"><svg th:replace="~{shared/icons :: icon('news')}"></svg><span>每日简报</span></a>
    <a href="/reader/radar"><svg th:replace="~{shared/icons :: icon('radar')}"></svg><span>精选日报</span></a>
    <a href="/reader/bookmarks"><svg th:replace="~{shared/icons :: icon('bookmark')}"></svg><span>收藏</span></a>
    <a href="/reader/search"><svg th:replace="~{shared/icons :: icon('search')}"></svg><span>搜索</span></a>
    <a th:if="${viewer == null or viewer.admin()}" href="/index#subscriptions"><svg th:replace="~{shared/icons :: icon('rss')}"></svg><span>订阅来源</span></a>
    <a th:if="${viewer == null or viewer.admin()}" href="/index" class="reader-nav-admin"><svg th:replace="~{shared/icons :: icon('settings')}"></svg><span>管理</span></a>
    <a href="/account" class="reader-nav-account" th:if="${viewer != null}" th:classappend="${!viewer.admin()} ? ' reader-nav-admin'"><svg th:replace="~{shared/icons :: icon('user')}"></svg><span th:text="${viewer.name()}">账户</span></a>
  </nav>
  <header class="rd-head reader-digest-head">
    <div class="reader-heading-copy">
      <div class="page-eyebrow">个人阅读工作台</div>
      <h1 class="rd-title" th:text="${hours <= 24 ? '今日速览' : hours <= 48 ? '近 48 小时' : hours <= 72 ? '近 3 天' : '近 7 天'}">今日速览</h1>
      <div class="rd-date"><span th:text="${date}">2026-10-04</span><span class="reader-heading-note"><span class="reader-meta-divider">·</span>按来源整理，专注值得读的内容</span></div>
    </div>
    <div class="rd-meta">
      <span class="rd-count" th:text="${totalCount} + ' 条内容'">0 条内容</span>
      <button type="button" class="rd-mark-all" @click="toggleListView()" :aria-pressed="listView"
              :title="listView ? '切换为卡片视图' : '切换为列表视图'">
        <span x-show="!listView"><svg th:replace="~{shared/icons :: icon('list')}"></svg>列表</span>
        <span x-show="listView" x-cloak><svg th:replace="~{shared/icons :: icon('grid')}"></svg>卡片</span>
      </button>
    </div>
  </header>

  <section class="reader-toolbar" aria-label="筛选文章">
    <form action="/reader/search" method="get" class="rd-search-form" role="search">
      <label class="sr-only" for="reader-search">筛选当前文章标题</label>
      <input id="reader-search" class="ui-control rd-search-input" type="search" name="q"
             x-model.debounce.200ms="searchQuery" @search="searchQuery = $event.target.value"
             placeholder="筛选当前文章标题…" autocomplete="off" aria-describedby="reader-search-hint">
      <button type="submit" class="rd-search-submit" title="搜索全部已保存的标题与摘要">搜索历史</button>
    </form>
    <p class="reader-toolbar-hint" id="reader-search-hint">输入即筛选当前内容，按 Enter 搜索历史标题与摘要。</p>
    <div class="rd-filter" th:if="${totalCount > 0}" role="group" aria-label="阅读状态">
      <button type="button" class="rd-filter-btn" :class="filter === 'all' && 'active'" :aria-pressed="filter === 'all'" @click="setFilter('all')">全部</button>
      <button type="button" class="rd-filter-btn" :class="filter === 'unread' && 'active'" :aria-pressed="filter === 'unread'" @click="setFilter('unread')">未读 <span x-text="unreadCount()"></span></button>
      <button type="button" class="rd-filter-btn" :class="filter === 'read' && 'active'" :aria-pressed="filter === 'read'" @click="setFilter('read')">已读</button>
      <button type="button" class="rd-filter-btn" :class="filter === 'bookmarked' && 'active'" :aria-pressed="filter === 'bookmarked'" @click="setFilter('bookmarked')">收藏 <span x-text="bookmarkCount()"></span></button>
    </div>
    <div class="rd-filter rd-filter--picks" th:if="${!picks.isEmpty()}" role="group" aria-label="AI 筛选">
      <button type="button" class="rd-filter-btn" :class="pickFilter === 'all' && 'active'" :aria-pressed="pickFilter === 'all'" @click="pickFilter = 'all'">全部文章</button>
      <button type="button" class="rd-filter-btn" :class="pickFilter === 'must' && 'active'" :aria-pressed="pickFilter === 'must'" @click="pickFilter = 'must'" title="AI 判断的重大、影响面广的新闻">必知</button>
      <button type="button" class="rd-filter-btn" :class="pickFilter === 'quality' && 'active'" :aria-pressed="pickFilter === 'quality'" @click="pickFilter = 'quality'" title="AI 判断有深度、值得完整阅读的内容">精选</button>
      <span class="reader-pick-accuracy" th:if="${picks.feedbackCount() > 0}"
            th:text="'近 30 天你反馈 ' + ${picks.feedbackCount()} + ' 条，准确 ' + ${picks.accuracyPercent()} + '%'"
            title="点标签旁的「准 / 不准」反馈，AI 之后挑选时会参考">近 30 天准确率</span>
    </div>
    <details class="reader-refinements">
      <summary>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M7 12h10M10 17h4"/></svg>
        <span>筛选与操作</span>
        <span class="reader-filter-overview"><span th:text="${hours == 24 ? '今天' : hours == 48 ? '48 小时' : hours == 72 ? '3 天' : '7 天'}">今天</span><span aria-hidden="true"> · </span><span x-text="activeTag === 'all' ? '全部分类' : activeTag">全部分类</span></span>
        <svg class="reader-disclosure-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
      </summary>
      <div class="reader-refinements-body">
        <div class="reader-filter-group">
          <span class="reader-filter-label">时间范围</span>
          <nav class="rd-tabs" aria-label="时间范围">
            <a href="/reader?hours=24" class="rd-tab" th:classappend="${hours == 24} ? ' active'" th:attr="aria-current=${hours == 24 ? 'page' : null}">今天</a>
            <a href="/reader?hours=48" class="rd-tab" th:classappend="${hours == 48} ? ' active'" th:attr="aria-current=${hours == 48 ? 'page' : null}">48 小时</a>
            <a href="/reader?hours=72" class="rd-tab" th:classappend="${hours == 72} ? ' active'" th:attr="aria-current=${hours == 72 ? 'page' : null}">3 天</a>
            <a href="/reader?hours=168" class="rd-tab" th:classappend="${hours == 168} ? ' active'" th:attr="aria-current=${hours == 168 ? 'page' : null}">7 天</a>
          </nav>
        </div>
        <div class="reader-filter-group" th:if="${#lists.size(uniqueTags) > 1}">
          <span class="reader-filter-label">来源分类</span>
          <div class="rd-tabs reader-category-tabs" role="group" aria-label="来源分类">
            <button type="button" class="rd-tab" :class="activeTag === 'all' && 'active'" :aria-pressed="activeTag === 'all'" @click="activeTag = 'all'">全部分类</button>
            <button th:each="tag : ${uniqueTags}" type="button" class="rd-tab" th:attr="data-tag=${tag}"
                    :class="activeTag === $el.dataset.tag && 'active'" :aria-pressed="activeTag === $el.dataset.tag"
                    @click="activeTag = $el.dataset.tag" th:text="${tag}">分类</button>
          </div>
        </div>
        <div class="reader-bulk-action" th:if="${totalCount > 0}">
          <button type="button" class="rd-mark-all" @click="markAllRead()" :disabled="anyReadPending() || unreadCount() === 0"
                  :aria-busy="readAllPending" aria-describedby="reader-bulk-hint"
                  x-text="readAllPending ? '正在保存…' : '本页全部标为已读'">本页全部标为已读</button>
          <span id="reader-bulk-hint" th:text="'将本页加载的 ' + ${totalCount} + ' 条内容标为已读，包含被筛选隐藏的文章。'">包含被筛选隐藏的文章。</span>
        </div>
      </div>
    </details>
    <div class="reader-result-line" th:if="${totalCount > 0}">
      <span role="status" aria-live="polite" aria-atomic="true">显示 <strong x-text="visibleCount()" th:text="${totalCount}">0</strong> / <span th:text="${totalCount}">0</span> 条</span>
      <button type="button" class="rd-mark-all" @click="resetFilters()" x-show="filter !== 'all' || activeTag !== 'all' || pickFilter !== 'all' || searchQuery" x-cloak>重置筛选</button>
      <details class="reader-shortcuts"><summary id="reader-shortcuts">键盘快捷键 <kbd>?</kbd></summary><p><kbd>j</kbd> / <kbd>k</kbd> 上下移动 · <kbd>o</kbd> 打开 · <kbd>b</kbd> 收藏 · <kbd>r</kbd> 已读</p></details>
    </div>
  </section>

  <div th:if="${groups.isEmpty()}" class="rd-empty" id="rd-main" tabindex="-1">
    <strong>阅读从一个订阅开始</strong>
    <p>选择感兴趣的来源并开启自动更新，新内容会整理在这里。</p>
    <a th:if="${viewer == null or viewer.admin()}" href="/index#subscriptions" class="reader-empty-action">选择订阅来源 →</a>
  </div>
  <div th:if="${!groups.isEmpty()}" class="rd-empty" x-show="visibleCount() === 0" x-cloak>
    <strong x-text="filter === 'unread' && activeTag === 'all' && !searchQuery.trim() ? '这段时间的内容已读完' : '没有符合筛选条件的内容'"></strong>
    <p x-text="filter === 'unread' && activeTag === 'all' && !searchQuery.trim() ? '可以回顾已读内容，或稍后再来看更新。' : '试试其他关键词，或重置分类与阅读状态。'"></p>
    <button type="button" @click="resetFilters()" class="reader-empty-action">查看本页全部内容</button>
  </div>
  <div class="rd-layout" th:if="${!groups.isEmpty()}">

    <!-- TOC sidebar (populated by JS) -->
    <nav class="rd-toc" id="rd-toc" aria-label="目录导航"></nav>

    <!-- Content area -->
    <div id="rd-main" tabindex="-1">

      <div th:each="group, gs : ${groups}"
           class="rd-section reveal"
           th:id="'sec-' + ${gs.index}"
           th:attr="data-tag=${group.tag()}"
           x-show="sectionVisible($el)">

        <div class="rd-section-head">
          <div class="reader-source-heading">
            <h2 class="rd-section-name" tabindex="-1" th:text="${group.name()}">来源</h2>
            <span th:if="${group.tag() != null}" class="reader-source-tag"
                  th:text="${group.tag()}">分类</span>
          </div>
          <span class="rd-badge" x-text="visibleCount($el.closest('.rd-section'))" th:text="${#lists.size(group.items())}">0</span>
        </div>

        <div class="rd-grid" :class="listView && 'rd-list'">
          <th:block th:each="item : ${group.items()}">
            <th:block th:replace="~{reader/fragments :: articleCard(${item}, ${aiEnabled})}"></th:block>
          </th:block>
        </div>

      </div>
    </div><!-- /rd-main -->
  </div><!-- /rd-layout -->

</main>
</body>
</html>
