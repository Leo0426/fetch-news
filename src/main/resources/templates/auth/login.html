<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>登录 · fetch-news</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/admin.css">
  <link rel="stylesheet" href="/admin-controls.css">
  <link rel="stylesheet" href="/admin-views.css">
  <link rel="stylesheet" href="/reader.css">
  <link rel="stylesheet" href="/briefing.css">
  <link rel="stylesheet" href="/ui-controls.css">
  <link rel="stylesheet" href="/account.css">
</head>
<body>
<main class="auth-shell">
  <section class="auth-card" aria-labelledby="sign-in-title">
    <div class="auth-brand"><img src="/favicon.svg" width="30" height="30" alt="">fetch-news</div>
    <h1 id="sign-in-title">登录账户</h1>
    <nav class="login-methods" aria-label="登录方式">
      <a th:href="|/login?method=password&amp;next=${#uris.escapeQueryParam(next)}|"
         th:attr="aria-current=${!tokenMode ? 'page' : null}">用户名与密码</a>
      <a th:href="|/login?method=token&amp;next=${#uris.escapeQueryParam(next)}|"
         th:attr="aria-current=${tokenMode ? 'page' : null}">访问令牌</a>
    </nav>
    <p th:if="${changed}" class="acct-banner ok" role="status">密码已保存，请使用新密码登录。</p>
    <p th:if="${error != null}" class="acct-banner err" role="alert" th:text="${error}"></p>
    <form method="post" action="/login" class="auth-fields">
      <input type="hidden" name="next" th:value="${next}">
      <th:block th:unless="${tokenMode}">
        <label class="field"><span>用户名</span>
          <input type="text" name="username" th:value="${username}" autocomplete="username" required maxlength="40"
                 autocapitalize="none" spellcheck="false" autofocus>
        </label>
        <label class="field"><span>密码</span>
          <input type="password" name="password" autocomplete="current-password" required>
        </label>
      </th:block>
      <label class="field" th:if="${tokenMode}"><span>访问令牌</span>
        <input type="password" name="token" autocomplete="off" autocapitalize="none" spellcheck="false"
               placeholder="输入完整令牌" required autofocus>
      </label>
      <button class="btn primary" type="submit">登录</button>
    </form>
    <p class="acct-muted" th:unless="${tokenMode}">已有令牌的用户可以先用令牌登录，再到「我的账户」设置密码。</p>
    <p class="acct-muted" th:if="${tokenMode}">使用管理员发给你的令牌，或在「我的账户」中创建的令牌。</p>
  </section>
</main>
</body>
</html>
