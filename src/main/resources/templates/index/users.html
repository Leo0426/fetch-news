<div id="users-view" class="user-admin" hx-history="false" hx-swap="innerHTML show:#main-content:top">
  <div th:replace="~{index/user-notice :: notice}"></div>
  <div th:unless="${authEnabled}" class="card account-section">
    <h2>认证已关闭</h2>
    <p>启用认证后可创建成员、管理登录凭据和查看个人阅读记录。</p>
  </div>
  <th:block th:if="${authEnabled}">
    <section class="card" aria-labelledby="accounts-title">
      <header class="card-head">
        <h2 id="accounts-title" class="card-title">账户 <span class="account-count" th:text="${users.size()}"></span></h2>
      </header>
      <ul class="accounts-list">
        <li th:each="u : ${users}" class="account-row">
          <div class="account-identity">
            <strong th:text="${u.name()}"></strong>
            <span class="account-meta" th:text="${u.role().label()}"></span>
            <span th:if="${u.disabled()}" class="pill off">已停用</span>
          </div>
          <p class="account-meta">
            <span th:text="${u.hasPassword()} ? '已设置密码' : '未设置密码'"></span>
            <span aria-hidden="true"> · </span>
            <span th:text="${u.hasToken()} ? '已设置令牌' : '无登录令牌'"></span>
          </p>
          <div class="account-actions">
            <button class="btn" type="button" th:attr="hx-get='/index/users/' + ${u.id()} + '/access',
                    aria-label='管理账户 ' + ${u.name()}" hx-target="#main-content">管理账户</button>
            <button class="btn" type="button" th:attr="hx-get='/index/users/' + ${u.id()} + '/content',
                    aria-label='管理 ' + ${u.name()} + ' 的阅读内容'" hx-target="#main-content">管理内容</button>
          </div>
        </li>
      </ul>
    </section>
    <section class="card account-section" aria-labelledby="create-user-title">
      <h2 id="create-user-title">添加成员</h2>
      <form class="account-create" x-data="{ loginMode: 'password' }" hx-post="/index/users"
            hx-target="#main-content" hx-sync="this:drop" hx-disabled-elt="find button">
        <label class="field"><span>账户名</span>
          <input class="ui-control" name="name" required maxlength="40" autocomplete="off">
        </label>
        <label class="field"><span>登录方式</span>
          <select class="ui-control" name="loginMode" x-model="loginMode">
            <option value="password">账户名和密码</option><option value="token">登录令牌</option>
          </select>
        </label>
        <label class="field" x-show="loginMode === 'password'"><span>初始密码</span>
          <input class="ui-control" type="password" name="password" autocomplete="new-password" minlength="8"
                 maxlength="128" :disabled="loginMode !== 'password'" :required="loginMode === 'password'"
                 placeholder="8–128 个字符">
        </label>
        <p x-show="loginMode === 'token'" x-cloak class="account-meta">创建后可复制一次登录令牌并交给成员。</p>
        <button class="btn primary" type="submit"><svg th:replace="~{shared/icons :: icon('plus')}"></svg>创建成员</button>
      </form>
    </section>
  </th:block>
</div>
