<div class="ai-connection-status" th:classappend="${status.serverReachable()} ? 'is-ok' : 'is-error'">
  <strong th:text="${status.serverReachable()} ? '服务器可达' : '连接失败'"></strong>
  <span th:if="${status.serverVersion() != null}" class="ai-protocol" th:text="${status.serverVersion()}"></span>
  <p th:if="${status.serverReachable() && status.modelListSupported()}"
     th:text="${status.modelAvailable()} ? '模型 ' + ${configuredModel} + ' 已列出' : '模型列表中未找到 ' + ${configuredModel}"></p>
  <p th:if="${status.error() != null}" th:text="${status.error()}"></p>
  <details th:if="${!status.availableModels().isEmpty()}" class="ai-discovered-list">
    <summary th:text="'查看 ' + ${status.availableModels().size()} + ' 个可用模型'"></summary>
    <ul><li th:each="model : ${status.availableModels()}"><code th:text="${model}"></code></li></ul>
  </details>
  <p th:if="${status.serverReachable() && status.modelListSupported() && status.availableModels().isEmpty()
             && status.serverVersion() != 'openai' && status.serverVersion() != 'anthropic' && status.serverVersion() != 'gemini'}">
    暂无本地模型，可运行 <code th:text="'ollama pull ' + ${configuredModel}"></code> 下载。
  </p>
</div>
