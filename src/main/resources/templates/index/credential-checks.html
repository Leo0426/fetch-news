<!-- Cookie check results, swapped into #credential-check -->
<div class="credential-checks" role="status">
  <p th:if="${checks.isEmpty()}" class="form-msg err">没有可验证的 Cookie，请先填写。</p>
  <div th:each="check : ${checks}" class="credential-check-row">
    <span th:if="${check.valid()}" class="form-msg ok" aria-label="有效">✓</span>
    <span th:unless="${check.valid()}" class="form-msg err" aria-label="无效">✗</span>
    <strong th:text="${check.label()}">X 登录 Cookie</strong>
    <span th:class="${check.valid()} ? 'form-msg ok' : 'form-msg err'" th:text="${check.message()}">有效</span>
  </div>
</div>
