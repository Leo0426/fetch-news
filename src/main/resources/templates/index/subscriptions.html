<section class="subscriptions-view" id="subscriptions-view"
         hx-get="/index/subscriptions" hx-trigger="routeSaved from:body"
         hx-include="#subscription-filters" hx-target="this" hx-swap="outerHTML"
         hx-sync="#main-content:replace">
  <header class="subscriptions-header">
    <div>
      <span class="page-eyebrow">让值得读的内容，自己到来</span>
      <h2>订阅来源</h2>
      <p>选择来源和更新频率，抓取完成后就能开始阅读。</p>
      <p>首次抓取会沿用现有的 AI 摘要和推送设置。</p>
    </div>
    <div class="reader-source-empty-actions">
      <button class="btn primary" type="button" hx-get="/index/subscriptions/new" hx-target="#modal-inner"
              hx-swap="innerHTML" hx-include="unset" @click="modal = true">
        <svg th:replace="~{shared/icons :: icon('plus')}"></svg>添加 RSS 订阅
      </button>
      <a class="btn" href="/reader/unread"><svg th:replace="~{shared/icons :: icon('inbox')}"></svg>进入待读</a>
    </div>
  </header>

  <div class="subscriptions-overview">
    <span><strong th:text="${page.totalCount()}">0</strong> 个来源</span>
    <span><strong data-subscription-count th:text="${page.subscribedCount()}">0</strong> 个自动更新</span>
    <span class="subscriptions-overview-note">按你的兴趣订阅，随时可以暂停。</span>
  </div>

  <form id="subscription-filters" class="subscription-filters" action="/index/subscriptions" method="get"
        hx-get="/index/subscriptions" hx-target="#subscriptions-view" hx-swap="outerHTML"
        hx-sync="#main-content:replace" hx-include="unset">
    <label class="subscription-search">
      <span class="ui-field-label">查找来源</span>
      <input class="ui-control" type="search" name="q" th:value="${page.q()}" maxlength="200"
             placeholder="搜索名称、介绍或主题">
    </label>
    <label>
      <span class="ui-field-label">内容分类</span>
      <select class="ui-control" name="category">
        <option value="">全部分类</option>
        <option th:each="category : ${page.categories()}" th:value="${category}" th:text="${category}"
                th:selected="${category == page.category()}"></option>
      </select>
    </label>
    <label>
      <span class="ui-field-label">订阅状态</span>
      <select class="ui-control" name="filter">
        <option value="all" th:selected="${page.filter() == 'all'}">全部来源</option>
        <option value="subscribed" th:selected="${page.filter() == 'subscribed'}">已订阅</option>
        <option value="attention" th:selected="${page.filter() == 'attention'}">需要关注</option>
      </select>
    </label>
    <button class="btn" type="submit"><svg th:replace="~{shared/icons :: icon('search')}"></svg>筛选</button>
  </form>

  <div th:if="${page.sources().isEmpty()}" class="subscriptions-empty">
    <h3>暂时没有符合条件的来源</h3>
    <p>试试其他关键词或分类，也可以添加自己的 RSS / Atom 订阅。</p>
    <a class="btn" href="/index#subscriptions" hx-get="/index/subscriptions"
       hx-target="#subscriptions-view" hx-swap="outerHTML" hx-include="unset"
       hx-sync="#main-content:replace">查看全部来源</a>
    <button class="btn primary" type="button" hx-get="/index/subscriptions/new" hx-target="#modal-inner"
            hx-swap="innerHTML" hx-include="unset" @click="modal = true">添加 RSS 订阅</button>
  </div>
  <div th:unless="${page.sources().isEmpty()}" class="subscription-grid" aria-label="订阅来源列表">
    <th:block th:each="source : ${page.sources()}">
      <th:block th:replace="~{index/subscription-card :: card(${source})}"></th:block>
    </th:block>
  </div>

  <footer class="subscriptions-note">
    <p>暂停订阅会保留已保存的文章，已经开始的抓取会继续完成。更新频率和 Cron 可在高级设置中调整。</p>
  </footer>
</section>
