<div class="ai-settings">
  <section class="card ai-overview" aria-labelledby="ai-overview-title">
    <div class="ai-overview-head">
      <div class="ai-heading-line">
        <h2 id="ai-overview-title">AI 功能</h2>
        <span class="ai-state" th:classappend="${config.enabled()} ? 'is-on' : ''"
              th:text="${config.enabled()} ? '已开启' : '已关闭'"></span>
      </div>
      <form data-ai-settings hx-post="/index/ai/enabled" hx-target="#main-content" hx-swap="innerHTML"
            hx-disabled-elt="find button">
        <input type="hidden" name="enabled" th:value="${!config.enabled()}">
        <button class="btn" type="submit" th:text="${config.enabled()} ? '关闭 AI' : '开启 AI'"></button>
      </form>
    </div>
    <dl class="ai-overview-data">
      <div><dt>当前提供商</dt><dd th:text="${page.activeName()}"></dd></div>
      <div><dt>默认模型</dt><dd><code th:text="${config.model()}"></code></dd></div>
      <div><dt>已缓存正文</dt><dd th:text="${extractCount}"></dd></div>
      <div><dt>已缓存摘要</dt><dd th:text="${summaryCount}"></dd></div>
    </dl>
  </section>
  <div th:if="${message != null}" class="ai-notice form-msg ok" role="status" tabindex="-1" th:text="${message}"></div>
  <div class="ai-workspace">
    <section class="card ai-library" aria-labelledby="ai-library-title">
      <header class="ai-section-head">
        <h2 id="ai-library-title">提供商</h2>
        <button class="btn ai-add" type="button" data-ai-open-editor hx-get="/index/ai?profileId=new"
                hx-target="#main-content" hx-swap="innerHTML" aria-label="添加自定义提供商">
          <svg th:replace="~{shared/icons :: icon('plus')}"></svg>添加
        </button>
      </header>
      <ul class="ai-library-list">
        <li th:each="platform : ${page.platforms()}"
            th:classappend="${platform.id() == editing.id()} ? 'is-editing' : ''">
          <button type="button" class="ai-library-item" data-ai-open-editor hx-target="#main-content" hx-swap="innerHTML"
                  th:attr="hx-get='/index/ai?profileId=' + ${platform.id()},aria-label='编辑提供商 ' + ${platform.name()},
                           aria-current=${platform.id() == editing.id() ? 'true' : null}">
            <span class="ai-library-info">
              <span class="ai-library-name"><strong th:text="${platform.name()}"></strong>
                <span th:if="${platform.active()}" class="ai-current">当前</span>
              </span>
              <span class="ai-library-detail"><span th:text="${platform.protocolLabel()}"></span>
                <span th:text="${platform.models().size()} + ' 个模型'"></span>
              </span>
              <code class="ai-library-model" th:text="${platform.config().model()}"></code>
            </span>
            <svg th:replace="~{shared/icons :: icon('right')}"></svg>
          </button>
          <form th:unless="${platform.active()}" class="ai-activate" data-ai-settings
                hx-post="/index/ai/activate" hx-target="#main-content" hx-swap="innerHTML" hx-disabled-elt="find button">
            <input type="hidden" name="profileId" th:value="${platform.id()}">
            <button type="submit" class="ai-text-button"
                    th:attr="aria-label='使用已保存的提供商 ' + ${platform.name()}">设为当前提供商</button>
          </form>
        </li>
      </ul>
    </section>
    <section class="card ai-editor-panel" aria-labelledby="ai-editor-heading">
      <header class="ai-section-head">
        <h2 id="ai-editor-heading" tabindex="-1"
            th:text="${editing.fresh()} ? '添加提供商' : '编辑提供商 · ' + ${editing.name()}"></h2>
      </header>
      <div class="ai-editor">
      <form id="ai-provider-form" data-ai-settings hx-post="/index/ai" hx-target="#main-content" hx-swap="innerHTML"
            hx-sync="this:drop" hx-disabled-elt="#ai-provider-form button:not([disabled])" x-data="aiProviderForm" th:attr="data-protocol=${editing.config().protocol()}"
            @input="providerChanged($event)" @change="providerChanged($event)">
        <input type="hidden" name="profileId" th:value="${editing.id()}">
        <input type="hidden" name="model" x-model="model" th:value="${editing.fresh() ? '' : editing.config().model()}">
        <input type="hidden" data-saved-model th:each="savedModel : ${editing.models()}" th:value="${savedModel}">
        <script type="application/json" data-saved-capabilities th:inline="javascript">[[${editing.modelCapabilities()}]]</script>
        <input type="hidden" name="modelCapabilities" :value="capabilitiesJson">
        <input type="hidden" name="editModel" :value="editModel">
        <section class="ai-fields" aria-labelledby="ai-connection-title">
          <h3 id="ai-connection-title">连接设置</h3>
          <div class="field-row">
            <label class="field"><span>提供商名称</span>
              <input class="ui-control" name="name" required maxlength="100" th:value="${editing.name()}"
                     placeholder="例如：我的中转服务">
            </label>
            <label class="field"><span>API 协议</span>
              <select class="ui-control" name="protocol" :value="protocol" @change="chooseProtocol($event.target.value)">
                <option value="openai" th:selected="${editing.config().protocol()=='openai'}">OpenAI 兼容</option>
                <option value="anthropic" th:selected="${editing.config().protocol()=='anthropic'}">Anthropic Messages</option>
                <option value="gemini" th:selected="${editing.config().protocol()=='gemini'}">Google Gemini</option>
                <option value="ollama" th:selected="${editing.config().protocol()=='ollama'}">Ollama</option>
              </select>
            </label>
          </div>
          <div class="field">
            <label for="ai-endpoint">API 基础地址</label>
            <input id="ai-endpoint" class="ui-control" name="host" type="url" required autocomplete="off" spellcheck="false"
                   th:value="${editing.config().host()}" aria-describedby="ai-endpoint-help">
            <p class="field-hint" id="ai-endpoint-help"
               x-text="protocol === 'gemini' ? '通常以 /v1beta 结尾。' : protocol === 'ollama' ? '填写服务根地址，例如 http://localhost:11434。' : '填写基础路径，例如 https://relay.example/v1。'"></p>
          </div>
          <div class="field">
            <label for="ai-api-key">API Key</label>
            <input id="ai-api-key" class="ui-control" name="apiKey" type="password" autocomplete="new-password"
                   th:placeholder="${editing.hasKey()} ? '已配置，留空保留原密钥' : '无需认证时可留空'">
            <label th:if="${editing.hasKey()}" class="ai-check">
              <input name="clearKey" type="checkbox" value="true">清除已保存密钥
            </label>
          </div>
          <div class="ai-connection-check">
              <button class="btn" type="button" data-ai-probe="正在测试连接…" hx-post="/index/ai/test"
                      hx-include="closest form" hx-target="#ai-connection-result" hx-swap="innerHTML"
                      hx-sync="#ai-provider-form:drop">
                <svg th:replace="~{shared/icons :: icon('health')}"></svg>测试连接
              </button>
            <div id="ai-connection-result" data-ai-probe-result role="status" aria-live="polite" aria-atomic="true"></div>
          </div>
        </section>
        <section class="ai-fields ai-models" aria-labelledby="ai-models-title">
          <div class="ai-models-head"><h3 id="ai-models-title">模型列表 <span class="ai-model-count" x-text="models.length"></span></h3><button class="btn" type="button" @click="openModelDialog()"><svg th:replace="~{shared/icons :: icon('plus')}"></svg>添加模型</button></div>
          <p class="field-hint">选中的默认模型用于摘要、正文提取和日报。</p>
          <p class="ai-model-empty" x-show="models.length === 0" x-cloak>请先添加至少一个模型。</p>
          <input type="hidden" name="modelIds" value="" :disabled="models.length > 0">
          <ul class="ai-model-list" aria-label="已添加的模型">
            <template x-for="savedModel in models" :key="savedModel">
              <li class="ai-model-item">
                <input type="hidden" name="modelIds" :value="savedModel">
                <label class="ai-model-choice"><input type="radio" name="modelChoice" :value="savedModel" x-model="model" :aria-label="'设为默认模型：' + savedModel"><code x-text="savedModel"></code><span class="pill on" x-show="model === savedModel">默认</span></label>
                <button class="ai-text-button ai-remove-model" type="button" @click="removeModel(savedModel)" :disabled="model === savedModel" :aria-label="'删除模型：' + savedModel">删除</button>
              </li>
            </template>
          </ul>
        </section>
        <dialog class="ai-model-dialog" x-ref="modelDialog" aria-labelledby="ai-model-dialog-title" @keydown.escape.stop>
          <div class="modal-head"><h2 class="modal-ttl" id="ai-model-dialog-title">添加模型</h2><button class="modal-x" type="button" aria-label="关闭添加模型" @click="$refs.modelDialog.close()"><svg th:replace="~{shared/icons :: icon('close')}"></svg></button></div>
          <div class="modal-body">
            <label class="field"><span>模型 ID</span><input class="ui-control" x-ref="modelId" x-model="draftModel" autocomplete="off" placeholder="例如：glm-5.3-flash" @input="modelError = ''" @keydown.enter.prevent="addModel()"></label>
            <button class="btn ai-discover-models" type="button" @click="loadModels()" :disabled="modelsLoading" :aria-busy="modelsLoading" x-text="modelsLoading ? '正在获取模型…' : '获取模型列表'">获取模型列表</button>
            <label class="field" x-show="availableModels.length > 0"><span>可用模型</span><select class="ui-control" x-model="draftModel"><option value="">请选择模型</option><template x-for="availableModel in availableModels" :key="availableModel"><option :value="availableModel" :disabled="models.includes(availableModel)" x-text="availableModel + (models.includes(availableModel) ? '（已添加）' : '')"></option></template></select></label>
            <p class="field-hint" role="status" aria-live="polite" x-text="modelMessage"></p>
            <p class="form-msg err" role="alert" x-show="modelError" x-text="modelError"></p>
            <div class="form-acts"><button class="btn" type="button" @click="$refs.modelDialog.close()">取消</button><button class="btn primary" type="button" @click="addModel()">添加到列表</button></div>
          </div>
        </dialog>
        <section class="ai-fields ai-model-options" x-show="models.length" x-cloak aria-labelledby="ai-options-title">
          <h3 id="ai-options-title">模型配置与测试</h3>
          <label class="field"><span>正在配置的模型</span>
            <select class="ui-control" x-model="editModel">
              <template x-for="id in models" :key="id">
                <option :value="id" x-text="id"></option>
              </template>
            </select>
          </label>
          <template x-if="selectedDraft">
            <details class="ai-advanced">
              <summary>模型高级选项</summary>
              <label class="field" x-show="protocol === 'openai'"><span>生成接口</span>
                <select class="ui-control" x-model="selectedDraft.apiStyle">
                  <option value="auto">自动选择</option>
                  <option value="chat">Chat Completions</option>
                  <option value="responses">Responses</option>
                </select>
              </label>
              <div class="field-row">
                <label class="field"><span>最大输出 Token</span>
                  <input class="ui-control" type="number" min="1" max="1000000" required
                         x-model.number="selectedDraft.maxTokens">
                </label>
                <label class="field" x-show="protocol === 'openai' && selectedDraft.apiStyle !== 'responses'">
                  <span>Chat 输出上限字段</span>
                  <select class="ui-control" x-model="selectedDraft.tokenLimitParameter">
                    <option value="auto">自动选择</option>
                    <option value="max_tokens">max_tokens</option>
                    <option value="max_completion_tokens">max_completion_tokens</option>
                  </select>
                </label>
              </div>
              <label class="field" x-show="protocol !== 'anthropic'">
                <span><input type="checkbox" x-model="selectedDraft.jsonMode"> 使用原生 JSON 模式</span>
                <span class="field-hint">用于精选日报等需要结构化输出的任务。</span>
              </label>
              <label class="field"><span>附加生成参数（JSON，可选）</span>
                <textarea class="ui-control" rows="4" spellcheck="false" autocomplete="off"
                          x-model="selectedDraft.parameters" :placeholder="parameterExample"></textarea>
                <span class="field-hint">可设置采样、推理和流式输出参数。</span>
              </label>
            </details>
          </template>
          <p class="form-msg err" role="alert" x-show="invalidDraft" x-text="invalidDraft"></p>
          <div class="ai-probe">
            <div class="ai-probe-actions">
              <button class="btn" type="button" data-ai-probe="正在等待模型生成…" hx-post="/index/ai/test-generation"
                      hx-include="closest form" hx-target="#ai-test-result" hx-swap="innerHTML"
                      hx-sync="#ai-provider-form:drop" :disabled="!editModel || !!invalidDraft">
                <svg th:replace="~{shared/icons :: icon('ai')}"></svg>测试模型生成
              </button>
            </div>
            <p class="field-hint">生成测试会向所选模型发送一条简短请求，可能产生费用。</p>
            <div id="ai-test-result" data-ai-probe-result role="status" aria-live="polite" aria-atomic="true"></div>
          </div>
        </section>
        <footer class="ai-save">
          <p class="field-hint" th:text="${editing.active()} ? '保存后，当前提供商的设置立即生效。' : '保存并启用即可切换当前提供商。'"></p>
          <div class="ai-save-actions">
            <button class="btn primary" type="submit" name="activate" value="false" :disabled="!model || !!invalidDraft">
              <svg th:replace="~{shared/icons :: icon('save')}"></svg>保存提供商
            </button>
            <button class="btn" type="submit" name="activate" value="true" th:if="${!editing.active()}"
                    :disabled="!model || !!invalidDraft">保存并启用</button>
          </div>
        </footer>
      </form>
      <form data-ai-settings th:if="${!editing.fresh() && !editing.active()}" hx-post="/index/ai/delete"
            hx-target="#main-content" hx-swap="innerHTML" hx-disabled-elt="find button" class="ai-delete">
        <input name="profileId" type="hidden" th:value="${editing.id()}">
        <button class="ai-text-button" type="submit">删除此提供商</button>
      </form>
      </div>
    </section>
  </div>
</div>
