<div class="console-overview">
  <dl class="console-metrics" aria-label="运行概况">
    <div>
      <dt>路由总数</dt><dd th:text="${#lists.size(routes)}">0</dd>
    </div>
    <div>
      <dt>已启用</dt><dd th:text="${enabledCount}">0</dd>
    </div>
    <div>
      <dt>已启用定时抓取</dt><dd th:text="${scheduledCount}">0</dd>
    </div>
    <div>
      <dt>运行时间</dt><dd th:text="${uptime}">—</dd>
    </div>
  </dl>

  <p th:if="${!hasData}" class="console-start">
    <svg th:replace="~{shared/icons :: icon('rss')}"></svg>
    <span>暂无抓取数据，订阅一个来源即可开始收集文章。</span>
    <a href="/index#subscriptions">订阅来源 →</a>
  </p>

  <section class="route-directory" aria-labelledby="directory-title" x-data="{ found: 0 }"
           x-effect="found = filterStats($el, routeQuery, routeScope)">
    <header class="directory-head">
      <h2 id="directory-title">路由数据</h2>
      <span role="status" aria-live="polite" aria-atomic="true" class="directory-count"
            th:text="|共 ${#lists.size(routes)} 个路由|" x-text="'共 ' + found + ' 个路由'"></span>
      <button id="refresh-stats" class="btn directory-refresh" type="button" hx-get="/index/stats"
              hx-target="#main-content" hx-swap="innerHTML" hx-sync="#main-content:replace"
              hx-disabled-elt="this" aria-label="刷新路由统计">
        <svg th:replace="~{shared/icons :: icon('refresh')}"></svg>刷新
      </button>
    </header>
    <div class="directory-tools" role="search" aria-label="查找路由" x-cloak>
      <label class="directory-search">
        <svg th:replace="~{shared/icons :: icon('search')}"></svg>
        <input type="search" class="ui-control" x-model="routeQuery" x-ref="routeSearch"
               aria-label="搜索路径、别名或分类" placeholder="搜索路径、别名或分类">
      </label>
      <select class="ui-control" x-model="routeScope" aria-label="筛选路由状态">
        <option value="all">全部路由</option>
        <option value="enabled">已启用</option>
        <option value="saved">有已存条目</option>
      </select>
    </div>
    <div class="directory-table-wrap">
      <table class="rtable directory-table" aria-labelledby="directory-title"
             x-show="found > 0">
        <thead>
          <tr>
            <th scope="col">路径</th>
            <th scope="col">分类</th>
            <th scope="col">状态</th>
            <th scope="col">已存条目</th>
            <th scope="col">最后抓取</th>
            <th scope="col">更新计划</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="stat : ${routeStats}"
              th:with="cfg=${stat.config},template=${templateRoutes.contains(cfg.path)}"
              th:attr="data-route=|${cfg.displayName()} ${cfg.path} ${stat.category}|,data-enabled=${cfg.enabled and !template},data-saved=${stat.itemCount > 0}">
            <td class="directory-path">
              <a th:unless="${template}" class="stats-path-link"
                 th:href="|/index#items=${#uris.escapeQueryParam(cfg.path)}|">
                <span th:if="${cfg.alias != null}" class="directory-alias" th:text="${cfg.alias}"></span>
                <span th:text="${cfg.path}"></span>
              </a>
              <span th:if="${template}" class="stats-path-tpl" th:text="${cfg.path}"></span>
            </td>
            <td class="directory-category"><span class="cat-chip" th:text="${stat.category}"></span></td>
            <td class="directory-state">
              <span th:if="${template}" class="directory-template">模板</span>
              <span th:unless="${template}" th:class="${cfg.enabled ? 'pill on' : 'pill off'}"
                    th:text="${cfg.enabled ? '已启用' : '未启用'}"></span>
            </td>
            <td data-label="已存条目"><span class="stats-num" th:text="${stat.itemCount}"></span></td>
            <td data-label="最后抓取" class="stats-time" th:text="${stat.lastFetched}"></td>
            <td data-label="更新计划">
              <span th:if="${!template and cfg.hasSchedule()}"
                    th:text="${cfg.scheduleCron != null ? cfg.scheduleCron : cfg.scheduleMinutes + ' 分钟'}"></span>
              <span th:if="${template or !cfg.hasSchedule()}" class="stats-dash">—</span>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
    <div class="directory-empty" x-show="found === 0" x-cloak>
      <p>没有符合条件的路由</p>
      <button class="btn" type="button" x-show="routeScope !== 'all' || routeQuery"
              @click="routeQuery = ''; routeScope = 'all'; $refs.routeSearch.focus()">清除筛选</button>
    </div>
  </section>
</div>
