<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>路由控制台</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/admin.css">
  <script src="/htmx.min.js"></script>
  <script defer src="/ui.js"></script>
  <script defer src="/admin.js"></script>
  <script defer src="/alpine.min.js"></script>
  <link rel="stylesheet" href="/radar-admin.css">
  <link rel="stylesheet" href="/ui-controls.css">
</head>
<body x-data="appShell()">
  <a class="skip-link" href="#main-content">跳至主要内容</a>

  <div class="app" id="app-shell">
    <!-- ── Sidebar ──────────────────────────────────────────── -->
    <nav class="sidebar" id="console-sidebar" aria-label="控制台导航"
         :class="sbOpen && 'sb-open'" :inert="isMobile && !sbOpen"
         :aria-hidden="isMobile && !sbOpen ? 'true' : null"
         hx-sync="#main-content:replace">
      <div class="sb-brand">
        <img class="sb-logo" src="/favicon.svg" width="36" height="36" alt="">
        <div>
          <div class="sb-name">fetch-news</div>
          <div class="sb-ver" th:text="'v' + ${version}">v0.1.0</div>
        </div>
      </div>

      <button class="sidebar-close" type="button" @click="sbOpen = false" aria-label="关闭导航"><svg th:replace="~{shared/icons :: icon('close')}"></svg></button>
      <div class="sb-nav">
        <div class="nav-label">概览</div>
        <a class="nav-item" :class="{ active: activePage === 'stats' }"
           :aria-current="activePage === 'stats' ? 'page' : null"
           @click="navigate($event, 'stats')"
           href="/index#stats">
          <svg th:replace="~{shared/icons :: icon('chart')}"></svg>
          数据统计
        </a>

        <div class="nav-label" style="margin-top:10px;">阅读</div>
        <a class="nav-item" :class="{ active: activePage === 'subscriptions' }"
           :aria-current="activePage === 'subscriptions' ? 'page' : null"
           @click="navigate($event, 'subscriptions')" href="/index#subscriptions">
          <svg th:replace="~{shared/icons :: icon('rss')}"></svg>
          订阅来源
        </a>
        <a class="nav-item" href="/reader">
          <svg th:replace="~{shared/icons :: icon('book')}"></svg>
          今日速览
        </a>
        <a class="nav-item" href="/reader/briefing">
          <svg th:replace="~{shared/icons :: icon('news')}"></svg>
          每日简报
        </a>

        <div class="nav-label" style="margin-top:10px;">工具</div>
        <a class="nav-item" :class="{ active: activePage === 'ai' }"
           :aria-current="activePage === 'ai' ? 'page' : null"
           @click="navigate($event, 'ai')"
           href="/index#ai">
          <svg th:replace="~{shared/icons :: icon('ai')}"></svg>
          AI 设置
        </a>
      <a class="nav-item" href="/index#radar" @click="navigate($event,'radar')" :class="{active:activePage==='radar'}" :aria-current="activePage === 'radar' ? 'page' : null"><svg th:replace="~{shared/icons :: icon('radar')}"></svg>新闻雷达配置</a>
      <a class="nav-item" href="/index#radar-tasks" @click="navigate($event,'radar-tasks')" :class="{active:activePage==='radar-tasks'}" :aria-current="activePage === 'radar-tasks' ? 'page' : null"><svg th:replace="~{shared/icons :: icon('tasks')}"></svg>AI 任务</a>
      <a class="nav-item" href="/index#radar-evaluation" @click="navigate($event,'radar-evaluation')" :class="{active:activePage==='radar-evaluation'}" :aria-current="activePage === 'radar-evaluation' ? 'page' : null"><svg th:replace="~{shared/icons :: icon('chart')}"></svg>模型评测</a>
      <a class="nav-item" href="/index#radar-delivery" @click="navigate($event,'radar-delivery')" :class="{active:activePage==='radar-delivery'}" :aria-current="activePage === 'radar-delivery' ? 'page' : null"><svg th:replace="~{shared/icons :: icon('send')}"></svg>日报投递</a>
        <a class="nav-item" :class="{ active: activePage === 'credentials' }"
           :aria-current="activePage === 'credentials' ? 'page' : null"
           @click="navigate($event, 'credentials')"
           href="/index#credentials">
          <svg th:replace="~{shared/icons :: icon('key')}"></svg>
          凭据配置
        </a>
        <a class="nav-item" :class="{ active: activePage === 'feishu' }"
           :aria-current="activePage === 'feishu' ? 'page' : null"
           @click="navigate($event, 'feishu')"
           href="/index#feishu">
          <svg th:replace="~{shared/icons :: icon('send')}"></svg>
          飞书推送
        </a>
        <a class="nav-item" :class="{ active: activePage === 'health' }"
           :aria-current="activePage === 'health' ? 'page' : null"
           @click="navigate($event, 'health')"
           href="/index#health">
          <svg th:replace="~{shared/icons :: icon('health')}"></svg>
          Feed 健康
        </a>
        <a class="nav-item" :class="{ active: activePage === 'logs' }"
           :aria-current="activePage === 'logs' ? 'page' : null"
           @click="navigate($event, 'logs')"
           href="/index#logs">
          <svg th:replace="~{shared/icons :: icon('list')}"></svg>
          抓取日志
        </a>

        <div class="nav-label" style="margin-top:10px;">分类</div>
        <th:block th:each="cat : ${categoryList}">
          <a class="nav-item"
             :class="{ active: activePage === 'cat:' + $el.dataset.cat }"
             th:attr="data-cat=${cat.name}"
             :aria-current="activePage === 'cat:' + $el.dataset.cat ? 'page' : null"
             th:href="'/index#cat=' + ${#uris.escapeQueryParam(cat.name)}"
             @click="navigate($event, 'cat=' + encodeURIComponent($el.dataset.cat))">
            <svg th:replace="~{shared/icons :: icon('folder')}"></svg><span th:text="${cat.name}">分类</span>
            <span class="nav-badge" th:text="${cat.count}">0</span>
            <span th:if="${failingCategories != null and failingCategories.contains(cat.name)}"
                  class="health-dot health-dot--err"
                  style="margin-left:3px;flex-shrink:0;"
                  title="该分类下有路由抓取失败"></span>
          </a>
        </th:block>
      </div>

      <div class="sb-footer">
        <div class="sb-status-head">
          <span class="dot-live"></span>
          <span>控制台已连接</span>
        </div>
        <div class="sb-row">
          <span>运行时间</span>
          <span class="sb-row-val" th:text="${uptime}">—</span>
        </div>
        <div class="sb-row">
          <span>路由总数</span>
          <span class="sb-row-val" th:text="${#lists.size(routes)}">0</span>
        </div>
        <div class="sb-row">
          <span>版本</span>
          <span class="sb-row-val" th:text="${version}">—</span>
        </div>
      </div>
    </nav>

    <!-- ── Sidebar overlay (mobile) ─────────────────────────── -->
    <div class="sidebar-overlay" :class="sbOpen && 'sb-open'" @click="sbOpen = false" aria-hidden="true"></div>

    <!-- ── Main ─────────────────────────────────────────────── -->
    <div class="app-main" id="console-main">
      <header class="topbar">
        <button class="hamburger" type="button" @click="sbOpen = !sbOpen"
                aria-label="打开导航" aria-controls="console-sidebar" :aria-expanded="sbOpen"><svg th:replace="~{shared/icons :: icon('list')}"></svg></button>
        <div class="topbar-heading">
          <span class="console-eyebrow">我的信息工作台</span>
          <h1 class="topbar-title" x-text="pageTitle">数据统计</h1>
        </div>
        <div class="topbar-actions">
          <a class="topbar-reader-link" href="/reader">开始阅读 <span aria-hidden="true">↗</span></a>
          <span class="ver-tag" th:text="'v' + ${version}">v0.1.0</span>
        </div>
      </header>

      <main class="content" id="main-content" tabindex="-1" aria-busy="false"
            :aria-label="pageTitle" th:insert="~{index/stats}"></main>
    </div>
  </div>

  <!-- ── Modal overlay ───────────────────────────────────────── -->
  <div class="modal-back" x-show="modal" x-cloak @click.self="modal = false">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" tabindex="-1" @click.stop>
      <div id="modal-inner">
        <!-- loaded via HTMX -->
      </div>
    </div>
  </div>

</body>
</html>
