<th:block th:fragment="modal">
  <div class="modal-head">
    <h2 class="modal-ttl" id="modal-title"
          th:text="${isNew} ? '新建挂载' : (${selected.alias()} != null ? ${selected.alias()} : ${selected.path})">路由设置</h2>
    <button class="modal-x" type="button" aria-label="关闭设置" @click="modal = false"><svg th:replace="~{shared/icons :: icon('close')}"></svg></button>
  </div>

  <div class="modal-body">

    <details th:if="${about != null}" class="about-section">
      <summary>关于此来源</summary>
      <div class="about-body" th:utext="${about}"></div>
    </details>

    <form hx-post="/index/routes"
          hx-target="#modal-inner"
          hx-swap="innerHTML"
          th:attr="data-source-path=${isNew ? (#lists.isEmpty(sourceRoutes) ? '' : sourceRoutes[0].path) : selected.sourcePath}"
          x-data="{ srcPath: $el.dataset.sourcePath || '' }">
      <input type="hidden" name="isNew" th:value="${isNew}">

      <div class="field-row">
        <div class="field">
          <label class="field-label" for="modal-path">挂载路径</label>
          <input class="ui-control" id="modal-path" name="path" type="text"
                 autocomplete="off"
                 th:readonly="${!isNew}"
                 th:value="${isNew} ? '' : ${selected.path}"
                 th:placeholder="${isNew} ? '/my-hn' : ''">
        </div>
        <div class="field">
          <label class="field-label" for="modal-sourcePath">来源路由</label>
          <select class="ui-control" id="modal-sourcePath" name="sourcePath"
                  th:disabled="${!isNew and selected.path == selected.sourcePath}"
                  x-model="srcPath">
            <option th:if="${!isNew}"
                    th:value="${selected.sourcePath}"
                    th:text="${selected.sourcePath}" selected></option>
            <option th:each="r : ${sourceRoutes}"
                    th:if="${isNew or r.path != selected.sourcePath}"
                    th:value="${r.path}"
                    th:text="${r.path}"></option>
          </select>
          <input th:if="${!isNew and selected.path == selected.sourcePath}"
                 type="hidden" name="sourcePath"
                 th:value="${selected.sourcePath}">
        </div>
      </div>

      <!-- feedUrl: shown when source is /rss -->
      <div class="field" x-show="srcPath === '/rss'" x-cloak>
        <label class="field-label" for="modal-feedUrl">Feed URL</label>
        <input class="ui-control" id="modal-feedUrl" name="feedUrl" type="url" autocomplete="off"
               placeholder="https://example.com/feed.xml"
               th:value="${!isNew and selected.feedUrl() != null} ? ${selected.feedUrl()} : ''">
        <span class="field-hint">RSS 2.0 或 Atom 订阅地址</span>
      </div>

      <div class="field-row">
        <div class="field">
          <label class="field-label" for="modal-routeCacheTtlSeconds">路由缓存（秒）</label>
          <input class="ui-control" id="modal-routeCacheTtlSeconds" name="routeCacheTtlSeconds" type="number" min="1" step="1"
                 th:value="${isNew} ? 300 : ${selected.routeCacheTtlSeconds}">
        </div>
        <div class="field">
          <label class="field-label" for="modal-detailCacheTtlSeconds">详情缓存（秒）</label>
          <input class="ui-control" id="modal-detailCacheTtlSeconds" name="detailCacheTtlSeconds" type="number" min="1" step="1"
                 th:value="${isNew} ? 1800 : ${selected.detailCacheTtlSeconds}">
        </div>
      </div>

      <div class="field-row">
        <div class="field">
          <label class="field-label" for="modal-scheduleMinutes">定时间隔（分钟）</label>
          <input class="ui-control" id="modal-scheduleMinutes" name="scheduleMinutes" type="number" min="0" step="1"
                 placeholder="0"
                 th:value="${isNew} ? 0 : ${selected.scheduleMinutes}"
                 th:readonly="${!isNew and !selected.isSchedulable()}">
          <span class="field-hint"
                th:if="${!isNew and !selected.isSchedulable()}">参数化路由不支持定时抓取</span>
          <span class="field-hint"
                th:if="${isNew or selected.isSchedulable()}"
                th:text="${(!isNew and selected.scheduleCron != null)} ? '已被 Cron 表达式覆盖' : (${(isNew or selected.scheduleMinutes == 0)} ? '0 = 不启用' : '每 ' + ${selected.scheduleMinutes} + ' 分钟')"
                th:class="${(!isNew and selected.scheduleMinutes > 0 and selected.scheduleCron == null)} ? 'field-hint ok' : 'field-hint'"></span>
        </div>
        <div class="field">
          <label class="field-label" for="modal-scheduleCron">Cron 表达式（优先）</label>
          <input class="ui-control" id="modal-scheduleCron" name="scheduleCron" type="text"
                 autocomplete="off"
                 placeholder="0 0 8 * * *"
                 th:value="${isNew or selected.scheduleCron == null} ? '' : ${selected.scheduleCron}"
                 th:readonly="${!isNew and !selected.isSchedulable()}">
          <span th:if="${!isNew and selected.scheduleCron != null}"
                th:text="'有效 · ' + ${selected.scheduleCron}"
                class="field-hint ok"></span>
          <span class="field-hint"
                th:if="${isNew or selected.scheduleCron == null}">秒 分 时 日 月 周 · 留空则用间隔</span>
        </div>
      </div>

      <div class="field">
        <label class="field-label" for="modal-alias">别名 <span class="field-hint" style="display:inline;">(可选，显示在 UI 中替代路径)</span></label>
        <input class="ui-control" id="modal-alias" name="alias" type="text" autocomplete="off"
               placeholder="如：我的哔哩哔哩动态"
               th:value="${isNew or selected.alias() == null} ? '' : ${selected.alias()}">
      </div>

      <label class="toggle-row">
        <input name="enabled" type="checkbox" value="true"
               th:checked="${isNew or selected.enabled}">
        启用路由
      </label>

      <div class="form-acts">
        <button class="btn primary" type="submit"
                th:text="${isNew} ? '添加挂载' : '保存'">保存</button>
        <button class="btn" type="button" @click="modal = false">取消</button>
        <span th:if="${message != null}" class="form-msg ok" th:text="${message}">已保存</span>
        <span th:if="${error != null}"   class="form-msg err" role="alert" tabindex="-1" th:text="${error}">保存失败</span>
      </div>

    </form>

    <!-- Bilibili UID Cookie — shown inside modal-body for concrete /bilibili/followings/* routes -->
    <div th:if="${cookieUid != null}"
         style="margin-top:16px;border-top:1px solid var(--border-color);padding-top:14px;">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;">
        <span style="background:#fb7299;color:#fff;padding:1px 7px;border-radius:4px;font-size:11px;">B站</span>
        <span style="font-size:13px;font-weight:600;">Bilibili Cookie</span>
        <span style="font-size:12px;color:var(--text-secondary);">
          UID <code th:text="${cookieUid}"></code> 专属凭据
        </span>
      </div>

      <form hx-post="/index/credentials/uid-cookie"
            hx-target="#cookie-save-result"
            hx-swap="innerHTML">
        <input type="hidden" name="uid" th:value="${cookieUid}">

        <div class="field" style="margin-bottom:10px;">
          <textarea class="ui-control" name="cookie" aria-label="Bilibili Cookie" rows="3" autocomplete="off"

                    placeholder="完整 Cookie 字符串（动态路由）或 SESSDATA=xxx（视频/专栏路由）"
                    th:text="${cookieStored}"></textarea>
          <span class="field-hint">
            获取方式：打开
            <a th:href="'https://api.vc.bilibili.com/dynamic_svr/v1/dynamic_svr/dynamic_new?uid=0&amp;type=8'"
               target="_blank" style="color:var(--accent);">B站动态 API</a>
            → DevTools → Network → dynamic_new → 复制 Cookie header
          </span>
        </div>

        <div style="display:flex;align-items:center;gap:10px;">
          <button class="btn primary" type="submit" style="font-size:12px;padding:5px 14px;">
            保存 Cookie
          </button>
          <span id="cookie-save-result" style="font-size:12px;"></span>
        </div>
      </form>
    </div>

  </div>

  <!-- fetch log -->
  <div class="log-section"
       th:if="${!isNew and recentLogs != null and not #lists.isEmpty(recentLogs)}">
    <div class="log-head">
      <span class="log-title">最近抓取</span>
      <span class="log-sub" th:text="'共 ' + ${#lists.size(recentLogs)} + ' 条'"></span>
    </div>
    <table class="log-table">
      <thead>
        <tr>
          <th>时间</th><th>耗时</th><th>条目</th><th>新增</th><th>状态</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="e : ${recentLogs}"
            th:class="${e.ok} ? '' : 'log-row-err'">
          <td th:text="${e.formattedTime()}"></td>
          <td th:text="${e.durationMs} + ' ms'"></td>
          <td th:text="${e.itemCount}"></td>
          <td th:text="${e.newItemCount > 0} ? '+' + ${e.newItemCount} : '—'"></td>
          <td>
            <span th:if="${e.ok}"  class="pill on"  style="font-size:10px;">ok</span>
            <span th:if="${!e.ok}" class="pill off" style="font-size:10px;cursor:help;"
                  th:title="${e.errorDetail}">err</span>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</th:block>
