plugins {
    id 'java'
    id 'org.springframework.boot' version "${springBootVersion}"
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'app'
version = '0.7.1'

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'org.jsoup:jsoup:1.21.2'
    implementation 'com.github.ben-manes.caffeine:caffeine:3.2.3'
    implementation 'org.xerial:sqlite-jdbc:3.47.1.0'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'io.rest-assured:rest-assured:6.0.0'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-parameters'
    options.release = 25
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    def testRuntimeDir = layout.buildDirectory.dir("test-runtime/${name}").get().asFile
    // Relative credential paths must not resolve inside the developer checkout.
    workingDir testRuntimeDir
    systemProperty 'fetch-news.route-config', new File(testRuntimeDir, 'route-config.json').absolutePath
    systemProperty 'fetch-news.db', new File(testRuntimeDir, 'feed-store.db').absolutePath
    systemProperty 'fetch-news.ai-config', new File(testRuntimeDir, 'ai-config.json').absolutePath
    systemProperty 'fetch-news.feishu-config', new File(testRuntimeDir, 'feishu-config.json').absolutePath
    // Existing endpoint tests run as the owner; auth tests opt back in via @SpringBootTest properties.
    systemProperty 'fetch-news.auth.enabled', 'false'
    environment = environment.findAll { key, value ->
        key != 'OLLAMA_HOST' && key != 'TWITTER_COOKIE' &&
                key != 'BILIBILI_COOKIE' && !key.startsWith('BILIBILI_COOKIE_') &&
                !key.startsWith('FETCH_NEWS_')
    }
    doFirst {
        if (testRuntimeDir.exists() && !testRuntimeDir.deleteDir()) {
            throw new GradleException('Could not clean isolated test runtime directory')
        }
        if (!testRuntimeDir.mkdirs()) {
            throw new GradleException('Could not create isolated test runtime directory')
        }
    }
}
